name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The runner's PostgreSQL ships with ssl=on and a self-signed cert; uselibpqcompat keeps `require` from verifying it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=require&uselibpqcompat=true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          test "$(sudo -u postgres psql -Atc 'show ssl')" = on || { echo 'runner PostgreSQL has ssl off'; exit 1; }
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=require" -v ON_ERROR_STOP=1 -f test/setup.sql
      - run: pnpm test
