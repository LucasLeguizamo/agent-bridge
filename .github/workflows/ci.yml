name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The runner's PostgreSQL ships with ssl=on and a self-signed cert; uselibpqcompat keeps `require` from verifying it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=require&uselibpqcompat=true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          test "$(sudo -u postgres psql -Atc 'show ssl')" = on || { echo 'runner PostgreSQL has ssl off'; exit 1; }
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          psql "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=require" -v ON_ERROR_STOP=1 -f test/setup.sql
      - run: pnpm test

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file. Change both lines together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The whole history: a secret committed and later deleted is still published.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit for secrets
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner .
