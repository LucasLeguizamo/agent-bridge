# App name must be globally unique on Fly; change it if taken. Region is the closest to the Supabase project.
app = "agent-bridge"
primary_region = "sjc"
# Above the 30 s delivery timeout, so in-flight deliveries can finish on deploy.
kill_timeout = "35s"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # The dispatcher polls with no inbound traffic, so the Machine must never stop.
  auto_stop_machines = "off"
  auto_start_machines = false

  # A failed check takes the Machine out of routing and does not restart it, so a Supabase outage causes no restart loop.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
